<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1Tenth Live Camera</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; }
        video { width: 90%; max-width: 1200px; background: #000; border: 2px solid #444; border-radius: 8px; margin-top: 20px; }
        #status { margin-top: 20px; padding: 10px 20px; background: #222; display: inline-block; border-radius: 5px; font-weight: bold;}
    </style>
</head>
<body>
    <h2>🏎️ F1Tenth Live Stream</h2>
    <div id="status">🔴 Disconnected. Waiting for Signaling Server...</div>
    <br>
    <video id="videoElement" autoplay playsinline muted controls></video>

    <script>
        const ws = new WebSocket('ws://127.0.0.1:8765');
        const video = document.getElementById('videoElement');
        const status = document.getElementById('status');

        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.ontrack = (event) => {
            console.log("Video track received!");
            video.srcObject = event.streams[0];
            status.innerText = "🟢 Connected and Receiving Live Video";
            status.style.color = "#00ff00";
        };

        pc.oniceconnectionstatechange = () => {
            console.log("ICE State changed to:", pc.iceConnectionState);
            if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
                status.innerText = "🔴 Connection Lost";
                status.style.color = "red";
            }
        };

        ws.onopen = () => {
            status.innerText = "🟡 Connected to Server. Waiting for Jetson...";
            status.style.color = "yellow";
            ws.send(JSON.stringify({ type: "join", role: "receiver", room: "f1tenth" }));
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                // DIAGNOSTIC: Let's see exactly what IP the browser is trying to send
                console.log("Generated ICE Candidate: ", event.candidate.candidate);
                
                // THE FIX: Delay the ICE candidates by 500ms to avoid the GStreamer race condition
                setTimeout(() => {
                    ws.send(JSON.stringify({
                        type: "ice",
                        room: "f1tenth",
                        sdpMLineIndex: event.candidate.sdpMLineIndex, 
                        candidate: event.candidate.candidate
                    }));
                }, 500);
            }
        };

        ws.onmessage = async (event) => {
            if (event.data.includes("ready") || event.data.includes("joined") || event.data.includes("left")) return;

            try {
                const msg = JSON.parse(event.data);
                console.log("Received data from Jetson:", msg.type);
                
                // FIXED: The server sends 'offer', not 'sdp'
                if (msg.type === "offer") {
                    console.log("Processing SDP Offer...");
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.sdp }));
                    
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    
                    console.log("Sending SDP Answer back to Jetson...");
                    // FIXED: Send type 'answer' back to the server
                    ws.send(JSON.stringify({
                        type: "answer", 
                        room: "f1tenth",
                        sdp: answer.sdp
                    }));
                } else if (msg.type === "ice") {
                    await pc.addIceCandidate(new RTCIceCandidate({
                        sdpMLineIndex: msg.sdpMLineIndex, // Server sends camelCase
                        candidate: msg.candidate
                    }));
                }
            } catch (e) {
                console.error("Failed to parse message:", event.data, e);
            }
        };
    </script>
</body>
</html>
